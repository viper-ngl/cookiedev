<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In | Parkside Stores</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#08090d;color:#f9fafb;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:40px;width:100%;max-width:400px;text-align:center}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}
.logo img{width:28px;height:28px;object-fit:contain;filter:brightness(0) invert(1)}
.logo span{font-family:'Geist','Inter',sans-serif;font-weight:900;font-size:16px;letter-spacing:.05em}
h1{font-family:'Geist','Inter',sans-serif;font-size:22px;font-weight:800;margin-bottom:8px}
p{color:#4b5563;font-size:13px;margin-bottom:28px;line-height:1.6}
.dbtn{display:flex;align-items:center;justify-content:center;gap:12px;background:#5865F2;color:#fff;font-weight:700;font-size:15px;padding:14px 24px;border-radius:12px;text-decoration:none;transition:all .2s;width:100%}
.dbtn:hover{background:#4752c4}
.dbtn svg{width:22px;height:22px;flex-shrink:0}
.back{display:block;margin-top:16px;color:#374151;font-size:12px;text-decoration:none;transition:color .2s}.back:hover{color:#9ca3af}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="/images/logo-leaf.png" alt=""><span>PARKSIDE STORES</span></div>
  <h1>Sign In</h1>
  <p>Sign in with Discord to access your staff portal, apply for positions, and more.</p>
  <a href="#" id="dbtn" class="dbtn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.101 18.08.118 18.1.135 18.112a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    Continue with Discord
  </a>
  <a href="/" class="back">Back to home</a>
</div>
<script>
const redirect = new URLSearchParams(location.search).get('redirect') || '/';
const params = new URLSearchParams({client_id:'1556322821154807908',redirect_uri:location.origin+'/auth/callback',response_type:'code',scope:'identify',state:redirect});
document.getElementById('dbtn').href = 'https://discord.com/oauth2/authorize?'+params;
</script>
</body></html>
